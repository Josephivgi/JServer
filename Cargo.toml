[package]
name = "jserver"
version = "0.1.1"
edition = "2024"
description = "Watch your SSH servers' performance over time"

[[bin]]
name = "JServer"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "glow"] }
egui_plot = "0.38.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
ureq = { version = "3", features = ["json"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"
